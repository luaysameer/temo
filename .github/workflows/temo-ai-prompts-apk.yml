name: Build TEMO AI Prompts APK

on:
  push:
    branches:
      - build/temo-ai-prompts-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager --licenses >/dev/null || true && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: apk-build
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp apk-build/app/build/outputs/apk/debug/app-debug.apk dist/TEMO_AI_PROMPTS_1.0.0.apk
          ls -lh dist/TEMO_AI_PROMPTS_1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEMO_AI_PROMPTS_APK
          path: dist/TEMO_AI_PROMPTS_1.0.0.apk
          if-no-files-found: error
          retention-days: 30
