name: Build TEMO Arabic Extractor V3.2 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode TEMO Arabic V3 minimal source
        shell: bash
        run: |
          mkdir -p _apkbuild/v3minsrc
          cat _apkbuild/v3min/part*.b64 > _apkbuild/v3min/source.b64
          base64 -d _apkbuild/v3min/source.b64 > _apkbuild/v3min/source.zip
          echo "f6dccebe9464abc7719aeab8d0552c30085a180a8388650bc7df2113cdc1d19f  _apkbuild/v3min/source.zip" | sha256sum -c -
          unzip -q _apkbuild/v3min/source.zip -d _apkbuild/v3minsrc
          test -f _apkbuild/v3minsrc/app/src/main/java/com/temo/arabic/extractor/MainActivity.java
          test -f _apkbuild/v3minsrc/app/src/main/java/com/temo/arabic/extractor/CrashReporter.java
          test -f _apkbuild/v3minsrc/app/src/main/res/drawable/temo_icon.png

      - name: Apply V3.1 movie-title extraction patch
        shell: bash
        run: python .github/scripts/patch-temo-arabic-v31.py

      - name: Apply V3.2 title-only ZIP filename patch
        shell: bash
        run: python .github/scripts/patch-temo-arabic-v32.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build V3.2 debug APK
        shell: bash
        run: |
          cd _apkbuild/v3minsrc
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2.apk"

      - name: SHA-256
        shell: bash
        run: sha256sum TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2.apk | tee TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2.apk.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2_APK
          path: |
            TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2.apk
            TEMO_ARABIC_MOVIE_EXTRACTOR_V3_2.apk.sha256.txt
          if-no-files-found: error
