name: Build TEMO Arabic Extractor APK PR

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android V2 source
        shell: bash
        run: |
          mkdir -p _apkbuild/src
          cat _apkbuild/v2/part*.b64 > _apkbuild/v2/source.b64
          base64 -d _apkbuild/v2/source.b64 > _apkbuild/src.zip
          unzip -q _apkbuild/src.zip -d _apkbuild/src
          test -f _apkbuild/src/TEMO_ARABIC_EXTRACTOR_ANDROID/app/src/main/java/com/temo/arabic/extractor/CrashReporter.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        shell: bash
        run: |
          cd _apkbuild/src/TEMO_ARABIC_EXTRACTOR_ANDROID
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT.apk"
      - name: SHA-256
        shell: bash
        run: sha256sum TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT.apk | tee TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT.apk.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT_APK
          path: |
            TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT.apk
            TEMO_ARABIC_EXTRACTOR_V2_CRASH_REPORT.apk.sha256.txt
          if-no-files-found: error
