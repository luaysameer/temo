name: Publish SuperQi production assets

on:
  push:
    branches:
      - superqi-production
    paths:
      - '.build-assets/logo/**'
      - '.build-assets/video-v63b/**'
      - '.github/workflows/publish-superqi-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore TEMO SuperQi logo
        run: |
          mkdir -p /tmp/temo public/assets public/downloads public/css
          cat .build-assets/logo/part*.txt | base64 -d > /tmp/temo/logo.webp
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp public/assets/temo-superqi-logo.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=128:128' public/assets/favicon.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=192:192' public/assets/icon-192.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=512:512' public/assets/icon-512.png

      - name: Restore latest uploaded MP4
        run: |
          if [ -f .build-assets/video-v63b/video.b64 ]; then
            base64 -d .build-assets/video-v63b/video.b64 > /tmp/temo/user-upload.mp4
          elif ls .build-assets/video-v63b/part*.txt >/dev/null 2>&1; then
            cat .build-assets/video-v63b/part*.txt | base64 -d > /tmp/temo/user-upload.mp4
          else
            echo 'Uploaded MP4 source is missing'
            exit 1
          fi
          ffprobe -v error /tmp/temo/user-upload.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/user-upload.mp4 -map 0:v:0 -c:v copy -an -movflags +faststart public/assets/splash.mp4

      - name: Write mobile layout overrides
        run: |
          cat > public/css/mobile.css <<'CSS'
          @media (max-width: 720px) {
            body{padding-left:10px!important;padding-right:10px!important}
            .app-shell{width:100%!important;max-width:100%!important}
            .topbar{height:66px!important;gap:8px!important}
            .wordmark{font-size:20px!important;min-width:0}
            .top-actions{gap:7px!important}
            .phone,.apk-top{height:42px!important;padding:0 12px!important}
            .phone span{display:none!important}
            .main-tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important;padding:5px!important;top:6px!important}
            .main-tab{padding:10px 2px!important;font-size:10px!important;white-space:nowrap!important;overflow:hidden!important}
            .main-tab span{display:none!important}
            .media-hero{display:block!important;margin-top:12px!important}
            .side-stack{display:none!important}
            .video-stage{min-height:0!important;width:100%!important;padding:5px!important;border-radius:24px!important}
            .hero-video{display:block!important;width:100%!important;height:auto!important;max-height:58vh!important;aspect-ratio:auto!important;object-fit:contain!important;border-radius:20px!important;background:#02050b!important}
            .video-overlay{right:12px!important;bottom:12px!important;padding:8px 10px!important;border-radius:12px!important}
            .video-overlay span{font-size:14px!important}
            .video-overlay small{font-size:9px!important}
            .owner-strip{margin:10px 0!important;padding:9px 10px!important}
            .owner-t{display:none!important}
            .rate-dashboard{display:block!important;padding:15px!important;border-radius:20px!important;margin-bottom:10px!important}
            .rate-number{justify-content:center!important}
            .rate-number strong{font-size:38px!important}
            .rate-main{text-align:center!important}
            .rate-metrics{grid-template-columns:repeat(3,1fr)!important;margin-top:10px!important;gap:6px!important}
            .rate-metrics>div{padding:9px 6px!important;text-align:center!important}
            .converter-grid{grid-template-columns:1fr!important;gap:10px!important}
            .panel{padding:15px!important;border-radius:20px!important}
            .panel-head h2{font-size:18px!important}
            .money-field input{height:58px!important;font-size:23px!important}
            .result-card strong{font-size:30px!important}
            .wallet-cards{grid-template-columns:1fr 1fr!important}
            .form-grid,.form-grid.two,.planner-results{grid-template-columns:1fr!important}
            .guide-grid{grid-template-columns:1fr!important}
            footer{grid-template-columns:54px 1fr!important}
          }
          @media (max-width: 390px) {
            .wordmark{font-size:18px!important}
            .main-tab{font-size:9px!important}
            .hero-video{max-height:54vh!important}
          }
          CSS

      - name: Make production HTML versionless
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\?v=[0-9.]+', '', s)
          s = s.replace('./css/v63.css', './css/mobile.css')
          s = s.replace('./assets/temo-user-splash-v63.mp4', './assets/splash.mp4')
          s = s.replace('./assets/temo-splash.mp4', './assets/splash.mp4')
          if './css/mobile.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="./css/mobile.css">\n</head>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable Android APK
        run: |
          git fetch origin superqi-v5-apk-build-20260816
          git checkout origin/superqi-v5-apk-build-20260816 -- superqi-apk
          gradle -p superqi-apk assembleDebug
          cp superqi-apk/app/build/outputs/apk/debug/app-debug.apk public/downloads/TEMO-SuperQi.apk
          rm -rf superqi-apk
          git add -A superqi-apk || true

      - name: Verify clean production package
        run: |
          test -s public/index.html
          test -s public/css/app.css
          test -s public/css/mobile.css
          test -s public/assets/temo-superqi-logo.png
          test -s public/assets/splash.mp4
          test -s public/downloads/TEMO-SuperQi.apk
          if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 public/assets/splash.mp4 | grep -q .; then
            echo 'Unexpected audio track in splash MP4'
            exit 1
          fi
          if grep -qE '\?v=[0-9.]+' public/index.html; then
            echo 'Version query remains in production HTML'
            exit 1
          fi

      - name: Commit latest production only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f public/css/v63.css public/version.txt 2>/dev/null || true
          git add public/index.html public/css/mobile.css public/assets/temo-superqi-logo.png public/assets/favicon.png public/assets/icon-192.png public/assets/icon-512.png public/assets/splash.mp4 public/downloads/TEMO-SuperQi.apk
          if git diff --cached --quiet; then
            echo 'Nothing changed'
            exit 0
          fi
          git commit -m 'Replace old SuperQi production with latest versionless build'
          git push origin HEAD:superqi-production
