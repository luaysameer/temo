name: Publish SuperQi production assets

on:
  push:
    branches:
      - superqi-production
    paths:
      - '.build-assets/logo/**'
      - '.github/workflows/publish-superqi-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore correct TEMO SuperQi logo
        run: |
          mkdir -p /tmp/temo public/assets public/downloads
          cat .build-assets/logo/part*.txt | base64 -d > /tmp/temo/logo.webp
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp public/assets/temo-superqi-logo.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=128:128' public/assets/favicon.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=192:192' public/assets/icon-192.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/logo.webp -vf 'scale=512:512' public/assets/icon-512.png

      - name: Create silent animated MP4 splash
        run: |
          ffmpeg -hide_banner -loglevel error -y -loop 1 -i public/assets/temo-superqi-logo.png \
            -vf "scale=500:500,pad=540:960:(ow-iw)/2:(oh-ih)/2:color=0x050913,fade=t=in:st=0:d=0.7,fade=t=out:st=9.3:d=0.7,format=yuv420p" \
            -t 10 -r 24 -an -c:v libx264 -preset medium -crf 28 -movflags +faststart \
            public/assets/temo-splash.mp4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable Android APK
        run: |
          git fetch origin superqi-v5-apk-build-20260816
          git checkout origin/superqi-v5-apk-build-20260816 -- superqi-apk
          gradle -p superqi-apk assembleDebug
          cp superqi-apk/app/build/outputs/apk/debug/app-debug.apk public/downloads/TEMO-SuperQi.apk
          rm -rf superqi-apk

      - name: Verify production package
        run: |
          test -s public/assets/temo-superqi-logo.png
          test -s public/assets/temo-splash.mp4
          test -s public/downloads/TEMO-SuperQi.apk
          if ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 public/assets/temo-splash.mp4 | grep -q .; then
            echo 'Unexpected audio track in splash MP4'
            exit 1
          fi
          printf 'V6 FINAL - correct logo + silent MP4 splash + APK\n%s\n' "$(date -u +%FT%TZ)" > public/version.txt

      - name: Commit generated production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/temo-superqi-logo.png public/assets/favicon.png public/assets/icon-192.png public/assets/icon-512.png public/assets/temo-splash.mp4 public/downloads/TEMO-SuperQi.apk public/version.txt
          if git diff --cached --quiet; then
            echo 'Nothing changed'
            exit 0
          fi
          git commit -m 'Publish SuperQi V6 final assets'
          git push origin HEAD:superqi-production
