name: Restore SuperQi uploaded video

on:
  push:
    branches:
      - superqi-production
    paths:
      - '.github/workflows/restore-superqi-video.yml'

permissions:
  contents: write

jobs:
  restore-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore uploaded MP4 from source fragments
        run: |
          mkdir -p public/assets /tmp/temo
          cat .build-assets/video-v63b/part*.txt | base64 -d > /tmp/temo/uploaded.mp4
          test -s /tmp/temo/uploaded.mp4
          ffprobe -v error /tmp/temo/uploaded.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/temo/uploaded.mp4 -map 0:v:0 -c:v copy -an -movflags +faststart public/assets/splash.mp4
          ffprobe -v error public/assets/splash.mp4
          test "$(stat -c%s public/assets/splash.mp4)" -gt 10000

      - name: Commit real video into production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/splash.mp4
          if git diff --cached --quiet; then
            echo 'Video already current'
            exit 0
          fi
          git commit -m 'Restore real uploaded SuperQi splash video'
          git push origin HEAD:superqi-production
