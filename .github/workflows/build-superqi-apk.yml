name: Build TEMO SuperQi APK

on:
  push:
    branches:
      - superqi-v5-apk-build-20260816
    paths:
      - 'superqi-apk/**'
      - '.github/workflows/build-superqi-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release and debug APK
        working-directory: superqi-apk
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload release unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TEMO-SuperQi-release-unsigned
          path: superqi-apk/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TEMO-SuperQi-debug
          path: superqi-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
